name: Refresh official mandi data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-fetch dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Fetch one page from official OGD mandi resource
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import pandas as pd
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          api_key = os.getenv("DATA_GOV_IN_API_KEY", "").strip()
          if not api_key:
              print("Missing repository Actions secret DATA_GOV_IN_API_KEY.")
              sys.exit(1)

          url = "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070"
          session = requests.Session()
          retry = Retry(total=2, connect=2, read=1, backoff_factor=1,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=["GET"])
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.headers.update({"User-Agent": "KRBL-Mandi-AI-GitHubActions/1.1",
                                  "Accept": "application/json"})
          response = session.get(url, params={
              "api-key": api_key, "format": "json", "limit": 1000, "offset": 0
          }, timeout=(12, 35))
          response.raise_for_status()
          payload = response.json()
          if not isinstance(payload, dict):
              raise RuntimeError("Unexpected response format from OGD.")
          records = payload.get("records") or []
          if not records:
              raise RuntimeError("OGD returned zero records; existing snapshot left unchanged.")

          frame = pd.DataFrame(records).drop_duplicates()
          Path("data").mkdir(parents=True, exist_ok=True)
          frame.to_csv("data/ogd_latest.csv", index=False, encoding="utf-8-sig")
          print(f"Saved {len(frame)} unique official OGD records.")
          print(f"OGD reported total records: {payload.get('total', 'not supplied')}")
          print("Coverage is limited to one returned page; the API may not cover every state/mandi.")
          PY

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ogd_latest.csv
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit needed."
          else
            git commit -m "Refresh official mandi data snapshot"
            git push
          fi
