name: Refresh official mandi data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-fetch dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Fetch official OGD mandi data with bounded retries
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path
          import pandas as pd
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          api_key = os.getenv("DATA_GOV_IN_API_KEY", "").strip()
          if not api_key:
              print("ERROR: Missing repository Actions secret DATA_GOV_IN_API_KEY.")
              sys.exit(1)

          url = "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070"
          session = requests.Session()
          retry = Retry(total=1, connect=1, read=0, backoff_factor=0.5,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=["GET"])
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.headers.update({"User-Agent": "KRBL-Mandi-AI-GitHubActions/1.2",
                                  "Accept": "application/json"})

          last_error = None
          payload = None
          for attempt in range(1, 5):
              try:
                  print(f"OGD request attempt {attempt}/4")
                  response = session.get(
                      url,
                      params={"api-key": api_key, "format": "json", "limit": 1000, "offset": 0},
                      timeout=(15, 60),
                  )
                  response.raise_for_status()
                  candidate = response.json()
                  if not isinstance(candidate, dict):
                      raise RuntimeError("Unexpected JSON response format.")
                  records = candidate.get("records") or []
                  if not records:
                      raise RuntimeError("OGD returned zero records.")
                  payload = candidate
                  break
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {str(exc)[:240]}"
                  print(f"Attempt {attempt} failed: {last_error}")
                  if attempt < 4:
                      time.sleep(attempt * 5)

          if payload is None:
              print("ERROR: OGD refresh failed after four attempts.")
              print(f"Last error: {last_error}")
              print("Existing snapshot, if any, is intentionally preserved.")
              sys.exit(1)

          frame = pd.DataFrame(payload["records"]).drop_duplicates()
          Path("data").mkdir(parents=True, exist_ok=True)
          temp_path = Path("data/ogd_latest.csv.tmp")
          final_path = Path("data/ogd_latest.csv")
          frame.to_csv(temp_path, index=False, encoding="utf-8-sig")
          temp_path.replace(final_path)
          print(f"SUCCESS: Saved {len(frame)} unique official OGD records.")
          print(f"OGD reported total records: {payload.get('total', 'not supplied')}")
          print("WARNING: This is one API page; it may not cover every state or mandi.")
          PY

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ogd_latest.csv
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit needed."
          else
            git commit -m "Refresh official mandi data snapshot"
            git push
          fi
