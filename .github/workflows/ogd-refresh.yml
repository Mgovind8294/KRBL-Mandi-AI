name: Refresh official mandi data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-fetch dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Fetch paginated official OGD mandi data for six states
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from pathlib import Path
          import pandas as pd
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          api_key = os.getenv("DATA_GOV_IN_API_KEY", "").strip()
          if not api_key:
              print("ERROR: Missing repository Actions secret DATA_GOV_IN_API_KEY.")
              sys.exit(1)

          url = "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070"
          states = {
              "punjab": "Punjab",
              "haryana": "Haryana",
              "uttar pradesh": "Uttar Pradesh",
              "rajasthan": "Rajasthan",
              "uttarakhand": "Uttarakhand",
              "delhi": "Delhi",
              "nct of delhi": "Delhi",
              "national capital territory of delhi": "Delhi",
          }
          session = requests.Session()
          retry = Retry(total=1, connect=1, read=0, backoff_factor=0.8,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=["GET"])
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.headers.update({"User-Agent": "KRBL-Mandi-AI-GitHubActions/2.0",
                                  "Accept": "application/json"})

          page_size = 1000
          max_pages = 40
          all_rows = []
          reported_total = None
          for page in range(max_pages):
              params = {"api-key": api_key, "format": "json",
                        "limit": page_size, "offset": page * page_size}
              payload = None
              last_error = None
              for attempt in range(1, 4):
                  try:
                      print(f"Requesting OGD page {page + 1}, attempt {attempt}/3")
                      response = session.get(url, params=params, timeout=(15, 60))
                      response.raise_for_status()
                      candidate = response.json()
                      if not isinstance(candidate, dict):
                          raise RuntimeError("Unexpected JSON response format.")
                      rows = candidate.get("records") or []
                      if page == 0:
                          try:
                              reported_total = int(candidate.get("total"))
                          except (TypeError, ValueError):
                              reported_total = None
                      payload = candidate
                      break
                  except Exception as exc:
                      last_error = f"{type(exc).__name__}: {str(exc)[:180]}"
                      print(f"Page {page + 1} attempt {attempt} failed: {last_error}")
                      if attempt < 3:
                          time.sleep(attempt * 4)
              if payload is None:
                  print(f"ERROR: Could not fetch page {page + 1}; preserving previous snapshot. {last_error}")
                  sys.exit(1)
              rows = payload.get("records") or []
              if not rows:
                  print("Reached empty page; pagination complete.")
                  break
              all_rows.extend(rows)
              print(f"Page {page + 1}: {len(rows)} rows; cumulative {len(all_rows)}")
              if len(rows) < page_size or (reported_total is not None and len(all_rows) >= reported_total):
                  break
              time.sleep(0.25)

          if not all_rows:
              print("ERROR: OGD returned zero records; preserving previous snapshot.")
              sys.exit(1)

          frame = pd.DataFrame(all_rows).drop_duplicates()
          state_col = next((c for c in frame.columns if str(c).strip().lower() in ("state", "state name", "state_name")), None)
          if state_col is None:
              print(f"ERROR: No state field found. Columns: {list(frame.columns)}")
              sys.exit(1)
          normalized = frame[state_col].astype(str).str.strip().str.lower().replace(states)
          frame[state_col] = normalized.map(states).fillna(normalized.str.title())
          frame = frame[frame[state_col].isin({"Punjab", "Haryana", "Uttar Pradesh", "Rajasthan", "Uttarakhand", "Delhi"})].copy()
          if frame.empty:
              print("ERROR: No rows matched the six configured states; preserving previous snapshot.")
              sys.exit(1)

          Path("data").mkdir(parents=True, exist_ok=True)
          temp_path = Path("data/ogd_latest.csv.tmp")
          final_path = Path("data/ogd_latest.csv")
          frame.to_csv(temp_path, index=False, encoding="utf-8-sig")
          temp_path.replace(final_path)
          complete = reported_total is not None and len(all_rows) >= reported_total
          print(f"SUCCESS: Saved {len(frame)} unique official records for the six configured states.")
          print(f"Rows downloaded nationwide: {len(all_rows)}; OGD reported total: {reported_total}")
          print(f"Pagination complete against reported total: {complete}")
          print("State counts:")
          print(frame.groupby(state_col).size().to_string())
          print("Reminder: OGD mandi prices do not necessarily include arrival quantity; use a separate verified arrivals source where available.")
          PY

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ogd_latest.csv
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit needed."
          else
            git commit -m "Refresh paginated official mandi data for six states"
            git push
          fi
